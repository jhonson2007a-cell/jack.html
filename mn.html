<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <form id="registrationForm">
            <div class="input-group">
                <label for="name">Name</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="input-group">
                <label for="username">Uname</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            
            <div class="input-group">
                <label for="confirmPassword">Confirm Pwd</label>
                <input type="password" id="confirmPassword" required>
            </div>
            
            <button type="submit" id="saveBtn">Save</button>
        </form>
        
        <!-- Status message container for JavaScript tracking -->
        <div id="statusMessage"></div>
    </div>
    <style>body {
    font-family: Arial, sans-serif;
    background-color: #1e1e1e; /* Dark background matching the image */
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.form-container {
    border: 2px solid #ff4500; /* Reddish border tracking the hand-drawn sketch */
    padding: 25px;
    border-radius: 8px;
    width: 300px;
    background-color: #252526;
}

.input-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.input-group label {
    font-size: 16px;
    flex: 1;
}

.input-group input {
    flex: 1.5;
    padding: 6px;
    border: 1px solid #555;
    border-radius: 4px;
    background-color: #3c3c3c;
    color: white;
}

button {
    width: 100%;
    padding: 10px;
    background-color: transparent;
    border: 2px solid #ff4500;
    color: #ff4500;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s ease;
}

button:hover {
    background-color: #ff4500;
    color: white;
}

#statusMessage {
    margin-top: 15px;
    text-align: center;
    font-family: monospace;
    color: #00ffcc;
}   </style>
    

    <script const form = document.getElementById('registrationForm');
const statusMessage = document.getElementById('statusMessage');
const saveBtn = document.getElementById('saveBtn');

// Matching the background hint "innerHTML = Mouse is..."
// Tracks mouse movement over the Save button
saveBtn.addEventListener('mouseenter', () => {
    statusMessage.innerHTML = "Mouse is over the Save button";
};

saveBtn.addEventListener('mouseleave', () => {
    statusMessage.innerHTML = "";
});

// Form submission logic with basic password validation
form.addEventListener('submit', (e) => {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    if (password !== confirmPassword) {
        statusMessage.innerHTML = "<span style='color: red;'>Passwords do not match!</span>";
        return;
    }
    
    statusMessage.innerHTML = "<span style='color: green;'>Data saved successfully!</span>";
    form.reset();
});</script>
</body>
</html>
