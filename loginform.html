<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Page</title>
</head>
<body>

    <h3>Registration Form</h3>
    
    <form>
        <!-- Text Inputs -->
        <p>
            <input type="text" placeholder="username">
        </p>
        <p>
            <input type="password" placeholder="password">
        </p>

        <!-- Radio Buttons -->
        <p>Select your class</p>
        <p>
            <label>
                <input type="radio" name="class" value="XI"> class XI
            </label>
        </p>
        <p>
            <label>
                <input type="radio" name="class" value="XII"> class XII
            </label>
        </p>

        <!-- Checkboxes -->
        <p>Select Fav Subjects</p>
        <p>
            <label>
                <input type="checkbox" name="subject" value="Math"> Math
            </label>
        </p>
        <p>
            <label>
                <input type="checkbox" name="subject" value="Physics"> Physics
            </label>
        </p>
        <p>
            <label>
                <input type="checkbox" name="subject" value="Chemistry"> Chemistry
            </label>
        </p>
        <p>
            <label>
                <input type="checkbox" name="subject" value="Computer Science"> Computer Science
            </label>
        </p>

        <!-- Dropdown Menu -->
        <p>
            <select name="city">
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Bangalore">Bangalore</option>
            </select>
        </p>

        <!-- Textarea -->
        <p>Feedback</p>
        <p>
            <textarea rows="4" cols="30"></textarea>
        </p>

        <!--form submit-->
        <input type="Submit" value="Submit">
    </form>

</body>
</html>
