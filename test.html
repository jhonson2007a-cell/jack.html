<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>

       <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
       </div>

        <div class="form-group">
            <label for="confirm Password">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>

        <div class="button">
            <button type="submit" id="save" onmouseover="Savethis()" onmouseout="SAVE()">Move mouse here to Save</button>
        </div>
    </form>
    </table>
    
    <style>
    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    form {
        width: min(90%, 400px);
    }
  
</style>

    <p id="output"></p>
    <script>
        function Savethis() {
            document.getElementById("save").textContent = "click and Save ";
        }

        function SAVE() {
            document.getElementById("save").textContent = "Move mouse here to Save";
        }
    </script>
</body>
</html>
