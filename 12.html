<!DOCTYPE html>
<html>
    <body>
        <h2 id="title">Welcome......................</h2>
        <button onclick="changePage()">ChangePage</button>
       
    </body>
 <script>
    function changePage(){
    
        let heading=document.getElementById("title");
        heading.innerHTML="JavaScript Change ME";
        heading.style.color="blue";
        heading.style.fontSize="32px";
        
    }
</script>
</html>
