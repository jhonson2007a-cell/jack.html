<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            border: 2px solid #333;
            padding: 20px 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Header Navigation */
        .main-header {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .nav-bar {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding-bottom: 15px;
            border-bottom: 2px dashed #555;
            margin-bottom: 25px;
        }

        .nav-bar a {
            color: #000;
            text-decoration: none;
            margin: 0 10px;
        }

        .nav-bar a:hover {
            text-decoration: underline;
        }

        /* Form Section */
        .form-section {
            margin-bottom: 30px;
        }

        .form-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .form-group label {
            width: 120px;
            font-size: 15px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group select {
            flex: 1;
            max-width: 450px;
            padding: 5px 8px;
            font-size: 14px;
            border: 1px solid #333;
            background-color: #fff;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .radio-group label {
            width: auto;
            font-weight: normal;
            cursor: pointer;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .btn {
            padding: 6px 20px;
            font-size: 15px;
            font-weight: bold;
            background-color: #e0e0e0;
            border: 1px solid #333;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #cccccc;
        }

        /* Divider */
        .divider {
            border-top: 2px dashed #555;
            margin: 25px 0;
        }

        /* Registered Students Table Section */
        .table-section {
            margin-bottom: 20px;
        }

        .table-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        th, td {
            text-align: left;
            padding: 8px;
        }

        th {
            border-bottom: 2px dashed #555;
            font-weight: bold;
        }

        td {
            border-bottom: 1px solid #eee;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            padding-top: 15px;
            border-top: 2px dashed #555;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="main-header">STUDENT REGISTRATION</div>
        
        <div class="nav-bar">
            | <a href="#">Home</a> | 
            <a href="#">Registration</a> | 
            <a href="#">Student List</a> | 
            <a href="#">Contact</a> |
        </div>

        <!-- Registration Form -->
        <div class="form-section">
            <div class="form-title">Student Registration Form</div>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="rollno">Roll No.:</label>
                    <input type="text" id="rollno" name="rollno" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="branch">Branch:</label>
                    <select id="branch" name="branch" required>
                        <option value="" disabled selected>Select Branch</option>
                        <option value="CSE">CSE</option>
                        <option value="IT">IT</option>
                        <option value="ECE">ECE</option>
                        <option value="EE">EE</option>
                        <option value="ME">ME</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male" required> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn">Submit</button>
                    <button type="reset" class="btn">Reset</button>
                </div>
            </form>
        </div>

        <div class="divider"></div>

        <!-- Registered Students Table -->
        <div class="table-section">
            <div class="table-title">Registered Students</div>
            
            <table>
                <thead>
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Branch</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>101</td>
                        <td>Amit Kumar</td>
                        <td>CSE</td>
                        <td>amit@email.com</td>
                    </tr>
                    <tr>
                        <td>102</td>
                        <td>Neha Singh</td>
                        <td>IT</td>
                        <td>neha@email.com</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2026 Student Portal
        </div>
    </div>

</body>
</html>
